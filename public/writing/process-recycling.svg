<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Diagram of the paper recycling process">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c8102e"/></marker>
  </defs>
  <rect width="600" height="300" fill="#ffffff"/>
  <text x="300" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#141414" text-anchor="middle">How paper is recycled</text>
  <g fill="#ffffff" stroke="#141414" stroke-width="2.5">
    <rect x="30" y="60" width="150" height="70" rx="8"/><rect x="225" y="60" width="150" height="70" rx="8"/><rect x="420" y="60" width="150" height="70" rx="8"/>
    <rect x="420" y="170" width="150" height="70" rx="8"/><rect x="225" y="170" width="150" height="70" rx="8"/><rect x="30" y="170" width="150" height="70" rx="8"/>
  </g>
  <g fill="none" stroke="#c8102e" stroke-width="3" marker-end="url(#arrow)">
    <line x1="182" y1="95" x2="222" y2="95"/><line x1="377" y1="95" x2="417" y2="95"/>
    <line x1="495" y1="132" x2="495" y2="167"/>
    <line x1="418" y1="205" x2="378" y2="205"/><line x1="223" y1="205" x2="183" y2="205"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#141414" text-anchor="middle">
    <text x="105" y="90" font-weight="700">1</text><text x="105" y="110">Waste paper is collected</text>
    <text x="300" y="90" font-weight="700">2</text><text x="300" y="110">Sorted and cleaned</text>
    <text x="495" y="90" font-weight="700">3</text><text x="495" y="110">Mixed with water into pulp</text>
    <text x="495" y="200" font-weight="700">4</text><text x="495" y="220">Ink is removed</text>
    <text x="300" y="200" font-weight="700">5</text><text x="300" y="220">Pressed and dried</text>
    <text x="105" y="200" font-weight="700">6</text><text x="105" y="220">Rolled and cut to size</text>
  </g>
</svg>
