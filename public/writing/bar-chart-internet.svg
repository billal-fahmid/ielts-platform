<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-label="Bar chart of household internet access in three countries">
  <rect width="600" height="380" fill="#ffffff"/>
  <text x="300" y="26" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#141414" text-anchor="middle">Households with internet access (%)</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#55524f" text-anchor="end">
    <text x="62" y="304">0</text><text x="62" y="254">20</text><text x="62" y="204">40</text><text x="62" y="154">60</text><text x="62" y="104">80</text><text x="62" y="54">100</text>
  </g>
  <g stroke="#e3dedc" stroke-width="1">
    <line x1="70" y1="300" x2="570" y2="300"/><line x1="70" y1="250" x2="570" y2="250"/><line x1="70" y1="200" x2="570" y2="200"/>
    <line x1="70" y1="150" x2="570" y2="150"/><line x1="70" y1="100" x2="570" y2="100"/><line x1="70" y1="50" x2="570" y2="50"/>
  </g>
  <g>
    <rect x="105" y="150" width="50" height="150" fill="#141414"/><rect x="160" y="62.5" width="50" height="237.5" fill="#c8102e"/>
    <rect x="270" y="250" width="50" height="50" fill="#141414"/><rect x="325" y="115" width="50" height="185" fill="#c8102e"/>
    <rect x="435" y="287.5" width="50" height="12.5" fill="#141414"/><rect x="490" y="175" width="50" height="125" fill="#c8102e"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#141414" text-anchor="middle" font-weight="700">
    <text x="130" y="144">60</text><text x="185" y="56">95</text>
    <text x="295" y="244">20</text><text x="350" y="109">74</text>
    <text x="460" y="281">5</text><text x="515" y="169">50</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#141414" text-anchor="middle">
    <text x="157" y="322">United Kingdom</text><text x="322" y="322">Brazil</text><text x="487" y="322">India</text>
  </g>
  <rect x="215" y="345" width="14" height="14" fill="#141414"/><text x="235" y="357" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#141414">2005</text>
  <rect x="310" y="345" width="14" height="14" fill="#c8102e"/><text x="330" y="357" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#141414">2020</text>
</svg>
